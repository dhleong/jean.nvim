name: Continuous Integration

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.1

      - uses: turtlequeue/setup-babashka@v1.8.1
        with:
          babashka-version: 1.12.208

      - run: bb test
